# Vorlage für .streamlit/secrets.toml – am einfachsten erzeugt sie setup_login.py.
# secrets.toml kommt nie ins Git. Anleitung: README, „Anmeldung einrichten“ und „Online stellen“.

[auth]
# lokal http://localhost:8501/oauth2callback, online https://deine-adresse/oauth2callback
redirect_uri = "http://localhost:8501/oauth2callback"
# Zufälliger Schlüssel, erzeugen mit: python -c "import secrets; print(secrets.token_hex(32))"
cookie_secret = "HIER_EINEN_ZUFAELLIGEN_SCHLUESSEL_EINTRAGEN"
client_id = "HIER_DIE_CLIENT_ID.apps.googleusercontent.com"
client_secret = "HIER_DEN_CLIENTSCHLUESSEL_EINTRAGEN"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Optional: eine Strava-App für alle Konten (dann legt niemand eigene Strava-Schlüssel an)
# [strava]
# client_id = "12345"
# client_secret = "HIER_DAS_STRAVA_CLIENT_SECRET"
# redirect_uri = "http://localhost:8501/"   # online: https://deine-adresse/

# Optional: Konten in einem S3-kompatiblen Speicher sichern (z. B. Backblaze B2) – nötig bei Hostern
# ohne dauerhaften Speicher wie Streamlit Community Cloud
# [storage]
# endpoint_url = "https://s3.eu-central-003.backblazeb2.com"
# bucket = "BUCKET-NAME"
# key_id = "KEY-ID"
# application_key = "APPLICATION-KEY"

# Optional: erscheint im Datenschutzhinweis
# [app]
# operator = "Vorname Nachname"
# contact = "name@example.org"
# location = "bei Streamlit Community Cloud (Server in den USA), gesichert bei Backblaze B2 (EU)"
